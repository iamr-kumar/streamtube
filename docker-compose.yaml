version: "3.8"

services:
  streamer:
    build:
      context: .
      dockerfile: apps/streamer/Dockerfile
    container_name: streamtube-streamer
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - streamtube-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: streamtube-web
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-default-secret-change-me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - streamtube-network
    depends_on:
      streamer:
        condition: service_healthy

networks:
  streamtube-network:
    driver: bridge

volumes:
  streamer-data:
    driver: local
