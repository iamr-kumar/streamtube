version: "3.8"

services:
  streamer:
    build:
      context: .
      dockerfile: apps/streamer/Dockerfile
    container_name: streamtube-streamer
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - streamtube-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: streamtube-web
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - streamtube-network
    depends_on:
      streamer:
        condition: service_healthy

networks:
  streamtube-network:
    driver: bridge

volumes:
  streamer-data:
    driver: local
